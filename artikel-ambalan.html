<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel Pramuka SMKN Pancatengah</title>
  <!-- Menghubungkan ke file CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Navbar -->
<div class="navbar">
  <div class="navbar-content">
    <div class="brand-title">Artikel Pramuka</div>
    <button class="btn-fb" onclick="openWriteModal()">+ Tulis Artikel</button>
  </div>
</div>

<!-- Feed Container -->
<div class="container">
  <div class="feed-header">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari artikel..." onkeyup="filterArticles()">
    </div>
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="filterByCategory('semua')">Semua</button>
      <button class="filter-btn" onclick="filterByCategory('Latihan Rutin')">Latihan Rutin</button>
      <button class="filter-btn" onclick="filterByCategory('Random')">Random</button>
      <button class="filter-btn" onclick="filterByCategory('Pencapaian')">Pencapaian</button>
    </div>
  </div>
  
  <div class="feed-container" id="feedContainer"></div>
</div>

<!-- Modal Form Tulis Artikel -->
<div id="writeModal" class="modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Tulis Artikel Baru</h3>
      <button class="close-btn" onclick="closeWriteModal()">✕</button>
    </div>
    <div class="modal-body">
      <form onsubmit="submitArticle(event)">
        <div class="form-group">
          <label>Nama Pengunggah (Bebas) *</label>
          <input type="text" id="authorName" required placeholder="Tulis nama kamu...">
        </div>
        <div class="form-group">
          <label>PIN Rahasia Postingan (4 Angka) *</label>
          <input type="password" id="postPin" maxlength="4" required placeholder="Contoh: 1234 (Digunakan jika ingin hapus/edit artikel ini nanti)">
        </div>
        <div class="form-group">
          <label>Judul Artikel *</label>
          <input type="text" id="title" required placeholder="Tulis judul artikel...">
        </div>
        <div class="form-group">
          <label>Kategori *</label>
          <select id="category" required>
            <option value="Latihan Rutin">Latihan Rutin</option>
            <option value="Random">Random</option>
            <option value="Pencapaian">Pencapaian</option>
          </select>
        </div>
        <div class="form-group">
          <label>Upload Foto Artikel *</label>
          <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)">
          <input type="hidden" id="photoData">
          <img id="photoPreview" class="photo-preview-img">
        </div>
        <div class="form-group">
          <label>Ringkasan Singkat *</label>
          <textarea id="excerpt" required placeholder="Ringkasan..."></textarea>
        </div>
        <div class="form-group">
          <label>Isi Cerita Lengkap *</label>
          <textarea id="content" required style="min-height: 100px;" placeholder="Tulis cerita lengkap..."></textarea>
        </div>
        <button type="submit" class="btn-fb" style="width: 100%;">Publikasikan Artikel</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal Baca Detail -->
<div id="readModal" class="modal">
  <div class="modal-card" style="max-width: 600px;">
    <div class="modal-header">
      <h3>Detail Artikel</h3>
      <button class="close-btn" onclick="closeReadModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="readAuthorArea" class="post-author-bar"></div>
      <span id="readCategory" class="article-category"></span>
      <h2 id="readTitle" style="margin-bottom: 10px; font-size: 20px;"></h2>
      <div id="readImgContainer" class="article-thumb" style="display:none;">
        <img id="readImg">
      </div>
      <p id="readBody" style="line-height: 1.6; font-size: 14px; white-space: pre-line; margin-bottom: 15px;"></p>
      <div id="readActions" class="article-actions"></div>
    </div>
  </div>
</div>

<!-- Menghubungkan ke file JavaScript -->
<script src="script.js"></script>
</body>
</html>
