<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel Pramuka - Ambalan Ulul Ilmi Uswah</title>

  <!-- Firebase SDK (Realtime Online Database) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      background: #f8f6e9; /* Warna Cream khas desain gambar */
      color: #1a2e26;
      min-height: 100vh;
    }

    /* Header Navbar Khas Ambalan */
    .hero-header {
      background: #143829; /* Hijau Tua Pramuka */
      color: #ffffff;
      padding: 20px 15px 35px 15px;
      border-bottom: 3px solid #c8a858; /* Accent Emas */
    }

    .brand-container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #c8a858;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(200, 168, 88, 0.15);
      color: #c8a858;
      font-size: 20px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .brand-text h2 {
      font-size: 13px;
      letter-spacing: 1px;
      color: #e0d5ba;
      font-weight: 700;
      text-transform: uppercase;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
    }

    /* Container Utama */
    .container { 
      max-width: 700px; 
      margin: -18px auto 30px auto; 
      padding: 0 15px; 
    }

    .feed-header {
      background: #ffffff; 
      padding: 16px; 
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(20, 56, 41, 0.06); 
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%; 
      padding: 12px 16px; 
      border: 1px solid #e0d8c3;
      border-radius: 25px; 
      font-size: 14px; 
      background: #fbfaf5; 
      outline: none;
      margin-bottom: 12px;
      color: #143829;
    }
    .search-box input:focus { border-color: #143829; }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn {
      padding: 6px 14px; 
      border: 1px solid #e0d8c3; 
      background: #fbfaf5;
      color: #143829; 
      border-radius: 20px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: 600;
      white-space: nowrap;
    }
    .filter-btn.active { 
      background: #143829; 
      color: #ffffff; 
      border-color: #143829; 
    }

    .btn-tulis {
      background: #143829; 
      color: #ffffff; 
      border: 1px solid #c8a858; 
      padding: 8px 16px;
      border-radius: 20px; 
      cursor: pointer; 
      font-size: 13px; 
      font-weight: 700;
    }
    .btn-tulis:hover { background: #1c4d38; }

    /* Cards Artikel */
    .feed-container { display: flex; flex-direction: column; gap: 16px; }
    
    .article-card {
      background: #ffffff; 
      border-radius: 20px; 
      box-shadow: 0 8px 24px rgba(20, 56, 41, 0.06);
      padding: 22px; 
      cursor: pointer;
      border: 1px solid #f0eae0;
      transition: transform 0.2s ease;
    }
    .article-card:active { transform: scale(0.99); }

    .post-author-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .author-avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #143829;
      color: #c8a858; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 14px; text-transform: uppercase;
      border: 1px solid #c8a858;
    }
    .author-details { display: flex; flex-direction: column; }
    .author-name { font-weight: 700; font-size: 13px; color: #143829; }
    .post-time { font-size: 11px; color: #7a8a82; }

    .article-category {
      display: inline-block; padding: 4px 12px; background: rgba(20, 56, 41, 0.08);
      color: #143829; border-radius: 12px; font-size: 11px; font-weight: 700; margin-bottom: 8px;
    }

    .article-title { 
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 20px; 
      font-weight: 700; 
      color: #143829; 
      margin-bottom: 10px; 
      line-height: 1.3;
    }
    .article-excerpt { font-size: 14px; color: #3a4a42; margin-bottom: 12px; line-height: 1.5; }

    .article-thumb {
      width: 100%; max-height: 320px; background: #fbfaf5; display: flex;
      align-items: center; justify-content: center; font-size: 40px;
      border-radius: 12px; overflow: hidden; margin-bottom: 12px; border: 1px solid #f0eae0;
    }
    .article-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .article-actions { display: flex; gap: 8px; border-top: 1px solid #f0eae0; padding-top: 12px; }
    .btn-secondary-custom {
      background: #f0eae0; color: #143829; border: none; padding: 6px 14px;
      border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600;
    }

    /* Modal Form */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(20, 56, 41, 0.6); backdrop-filter: blur(4px);
      z-index: 1000; align-items: center; justify-content: center; padding: 15px;
    }
    .modal.active { display: flex; }
    .modal-card {
      background: #ffffff; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      width: 100%; max-width: 500px; overflow: hidden;
    }
    .modal-header {
      padding: 16px 20px; background: #143829; color: white;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-family: Georgia, serif; font-size: 18px; color: #ffffff; }
    .close-btn { background: rgba(255,255,255,0.2); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }
    .modal-body { padding: 20px; max-height: 80vh; overflow-y: auto; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #143829; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #e0d8c3; border-radius: 10px; font-size: 13px; background: #fbfaf5;
    }
    .photo-preview-img { width: 100%; max-height: 150px; object-fit: cover; margin-top: 8px; display: none; border-radius: 8px; }
  </style>
</head>
<body>

<div class="hero-header">
  <div class="brand-container">
    <div class="logo-circle">⚜</div>
    <div class="brand-text">
      <h2>AMBALAN</h2>
      <h1>ULUL ILMI - USWAH</h1>
    </div>
  </div>
</div>

<div class="container">
  <div class="feed-header">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Cari artikel Ambalan..." onkeyup="filterArticles()">
    </div>
    <div class="action-row">
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filterByCategory('semua', this)">Semua</button>
        <button class="filter-btn" onclick="filterByCategory('Latihan Rutin', this)">Latihan Rutin</button>
        <button class="filter-btn" onclick="filterByCategory('Random', this)">Random</button>
        <button class="filter-btn" onclick="filterByCategory('Pencapaian', this)">Pencapaian</button>
      </div>
      <button class="btn-tulis" onclick="openWriteModal()">+ Tulis</button>
    </div>
  </div>
  
  <div class="feed-container" id="feedContainer">
    <div style="text-align:center; padding:30px; background:white; border-radius:20px; color:#7a8a82;">Menghubungkan ke server database...</div>
  </div>
</div>

<!-- Modal Form Tulis Artikel -->
<div id="writeModal" class="modal">
  <div class="modal-card">
    <div class="modal-header">
      <h3 id="modalTitle">Tulis Artikel Baru</h3>
      <button class="close-btn" onclick="closeWriteModal()">✕</button>
    </div>
    <div class="modal-body">
      <form onsubmit="submitArticle(event)">
        <div class="form-group">
          <label>Nama Pengunggah (Bebas) *</label>
          <input type="text" id="authorName" required placeholder="Tulis nama kamu...">
        </div>
        <div class="form-group">
          <label>PIN Rahasia Postingan (4 Angka) *</label>
          <input type="password" id="postPin" maxlength="4" required placeholder="Contoh: 1234">
        </div>
        <div class="form-group">
          <label>Judul Artikel *</label>
          <input type="text" id="title" required placeholder="Tulis judul artikel...">
        </div>
        <div class="form-group">
          <label>Kategori *</label>
          <select id="category" required>
            <option value="Latihan Rutin">Latihan Rutin</option>
            <option value="Random">Random</option>
            <option value="Pencapaian">Pencapaian</option>
          </select>
        </div>
        <div class="form-group">
          <label>Upload Foto Artikel</label>
          <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)">
          <input type="hidden" id="photoData">
          <img id="photoPreview" class="photo-preview-img">
        </div>
        <div class="form-group">
          <label>Ringkasan Singkat *</label>
          <textarea id="excerpt" required placeholder="Ringkasan..."></textarea>
        </div>
        <div class="form-group">
          <label>Isi Cerita Lengkap *</label>
          <textarea id="content" required style="min-height: 100px;" placeholder="Tulis cerita lengkap..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn-tulis" style="width: 100%; border-radius: 10px; padding: 12px;">Publikasikan Artikel</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal Baca Detail -->
<div id="readModal" class="modal">
  <div class="modal-card" style="max-width: 600px;">
    <div class="modal-header">
      <h3>Detail Artikel</h3>
      <button class="close-btn" onclick="closeReadModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="readAuthorArea" class="post-author-bar"></div>
      <span id="readCategory" class="article-category"></span>
      <h2 id="readTitle" class="article-title" style="margin-bottom: 12px;"></h2>
      <div id="readImgContainer" class="article-thumb" style="display:none;">
        <img id="readImg">
      </div>
      <p id="readBody" style="line-height: 1.6; font-size: 14px; white-space: pre-line; margin-bottom: 15px; color: #2c3e35;"></p>
      <div id="readActions" class="article-actions"></div>
    </div>
  </div>
</div>

<script>
  // 1. TEMPEL KODE KONFIGURASI FIREBASE GRATIS ANDA DI SINI
  const firebaseConfig = {
    apiKey: "GANTI_DENGAN_API_KEY_ANDA",
    authDomain: "NAMA-PROJECT-ANDA.firebaseapp.com",
    databaseURL: "https://NAMA-PROJECT-ANDA-default-rtdb.firebaseio.com",
    projectId: "NAMA-PROJECT-ANDA",
    storageBucket: "NAMA-PROJECT-ANDA.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef123456"
  };

  // Inisialisasi Firebase Cloud
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_MASTER_PIN = "0000"; 
  let rawArticles = {};
  let currentFilter = 'semua';

  // Real-time listener dari Firebase Cloud
  db.ref('articles').on('value', (snapshot) => {
    rawArticles = snapshot.val() || {};
    renderFeed();
  });

  function openWriteModal() {
    document.getElementById('modalTitle').textContent = 'Tulis Artikel Baru';
    document.getElementById('writeModal').classList.add('active');
    document.querySelector('#writeModal form').reset();
    document.getElementById('photoData').value = '';
    document.getElementById('photoPreview').style.display = 'none';
  }

  function closeWriteModal() {
    document.getElementById('writeModal').classList.remove('active');
  }

  function previewPhoto(e) {
    const file = e.target.files[0];
    if (file) {
      if (file.size > 1000000) { 
        alert("Ukuran foto terlalu besar. Maksimal 1MB.");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('photoPreview').src = evt.target.result;
        document.getElementById('photoPreview').style.display = 'block';
        document.getElementById('photoData').value = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  function submitArticle(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Mengunggah ke Cloud...';

    const photoData = document.getElementById('photoData').value;
    const newArticle = {
      authorName: document.getElementById('authorName').value,
      pin: document.getElementById('postPin').value,
      title: document.getElementById('title').value,
      category: document.getElementById('category').value,
      excerpt: document.getElementById('excerpt').value,
      content: document.getElementById('content').value,
      photo: photoData || '📌',
      createdAt: Date.now()
    };

    db.ref('articles').push(newArticle, (err) => {
      btn.disabled = false;
      btn.textContent = 'Publikasikan Artikel';
      if (err) {
        alert("Gagal mengunggah: " + err.message);
      } else {
        closeWriteModal();
      }
    });
  }

  function renderFeed() {
    const container = document.getElementById('feedContainer');
    
    let articlesArray = Object.keys(rawArticles).map(key => ({
      firebaseId: key,
      ...rawArticles[key]
    }));

    if (currentFilter !== 'semua') {
      articlesArray = articlesArray.filter(a => a.category === currentFilter);
    }

    const query = document.getElementById('searchInput').value.toLowerCase();
    if (query) {
      articlesArray = articlesArray.filter(a => 
        (a.title && a.title.toLowerCase().includes(query)) || 
        (a.excerpt && a.excerpt.toLowerCase().includes(query))
      );
    }

    if (articlesArray.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:30px; background:white; border-radius:20px; color:#7a8a82;">Belum ada artikel.</div>';
      return;
    }

    container.innerHTML = articlesArray.sort((a,b) => b.createdAt - a.createdAt).map(article => {
      const firstLetter = article.authorName ? article.authorName.charAt(0) : '?';

      return `
        <div class="article-card" onclick="openReadModal('${article.firebaseId}')">
          <div class="post-author-bar">
            <div class="author-avatar">${firstLetter}</div>
            <div class="author-details">
              <span class="author-name">${article.authorName}</span>
              <span class="post-time">${new Date(article.createdAt).toLocaleDateString('id-ID')}</span>
            </div>
          </div>

          <span class="article-category">${article.category}</span>
          <h3 class="article-title">${article.title}</h3>
          <p class="article-excerpt">${article.excerpt}</p>

          <div class="article-thumb">
            ${article.photo && article.photo.startsWith('data:') ? `<img src="${article.photo}">` : `<span>${article.photo || '📌'}</span>`}
          </div>

          <div class="article-actions" onclick="event.stopPropagation();">
            <button class="btn-secondary-custom" style="color:#d32f2f;" onclick="deleteArticle('${article.firebaseId}')">Hapus</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function openReadModal(id) {
    const article = rawArticles[id];
    if (!article) return;

    const firstLetter = article.authorName ? article.authorName.charAt(0) : '?';

    document.getElementById('readAuthorArea').innerHTML = `
      <div class="author-avatar">${firstLetter}</div>
      <div class="author-details">
        <span class="author-name">${article.authorName}</span>
        <span class="post-time">${new Date(article.createdAt).toLocaleString('id-ID')}</span>
      </div>
    `;

    document.getElementById('readCategory').textContent = article.category;
    document.getElementById('readTitle').textContent = article.title;
    document.getElementById('readBody').textContent = article.content;

    const imgContainer = document.getElementById('readImgContainer');
    if (article.photo && article.photo.startsWith('data:')) {
      document.getElementById('readImg').src = article.photo;
      imgContainer.style.display = 'flex';
    } else {
      imgContainer.style.display = 'none';
    }

    document.getElementById('readActions').innerHTML = `
      <button class="btn-secondary-custom" style="color:#d32f2f;" onclick="deleteArticle('${id}')">Hapus</button>
    `;

    document.getElementById('readModal').classList.add('active');
  }

  function closeReadModal() {
    document.getElementById('readModal').classList.remove('active');
  }

  function deleteArticle(id) {
    const article = rawArticles[id];
    if (!article) return;

    const inputPin = prompt(`Masukkan PIN 4 angka postingan ini (atau PIN Pembina):`);
    
    if (inputPin === article.pin || inputPin === ADMIN_MASTER_PIN) {
      if (confirm('Yakin ingin menghapus artikel ini dari database cloud?')) {
        db.ref('articles/' + id).remove().then(() => {
          closeReadModal();
        });
      }
    } else if (inputPin !== null) {
      alert('PIN salah! Anda tidak bisa menghapus artikel ini.');
    }
  }

  function filterByCategory(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  }

  function filterArticles() {
    renderFeed();
  }
</script>
</body>
</html>
